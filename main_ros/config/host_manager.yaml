# =============================================================================
# host_manager.yaml — what the host PC (laptop) opens: host.launch.py
# =============================================================================
# The laptop does not join the robot's ROS 2 network (Humble laptop vs Jazzy
# robot): the monitor runs on the robot side and is shown here through ssh,
# and Foxglove connects to the bridge started by the robot's Program Manager.

log_root: ""                      # "" = main_ros/logs/host_manager_<mode>_<date>_<time>/

robot:
  sim:                            # the Spark, ROS 2 Jazzy in Docker
    ssh: spark-439@100.67.81.84   # ssh destination ("" = ROS runs on this PC)
    container: ray-puzzlebot-ros2 # running container ("" = no Docker)
    setup: "source /opt/ros/jazzy/setup.bash && source /ws/install/setup.bash"
    foxglove: ws://100.67.81.84:8765
  real:                           # the Jetson on the robot
    ssh: puzzlebot@jetson.local   # mDNS name: works whichever phone the Jetson is on
    container: ""
    setup: "source /opt/ros/humble/setup.bash && source ~/te3003b_ws/install/setup.bash"
    foxglove: ws://localhost:8765 # the bridge runs on this PC (local_bridge)
    local_bridge: true            # the Jetson has no foxglove_bridge: run it here over DDS

exit_with_monitor: true           # monitor window closed (after X, or Q) -> close everything here

monitor:
  title: Team Zero Mission Monitor
  geometry: 84x41                 # columns x rows (the monitor needs 82 x 38, 39 on the robot)

foxglove:
  open_studio: true               # open Foxglove Studio (desktop) connected to the robot
  studio_commands: [foxglove-studio, foxglove]
  close_studio_on_exit: true
  # local_bridge: the bridge on this PC (real robot). Large topics as best effort.
  bridge_cmd: 'ros2 run foxglove_bridge foxglove_bridge --ros-args -p port:=8765 -p address:=127.0.0.1 -p send_buffer_limit:=10000000 -p num_threads:=2 -p "best_effort_qos_topic_whitelist:=[''^(/tf|/laser_scan|/slam/scan|/slam/particles|/slam/pose|/wheel/odom|/navigation/local_costmap|/navigation/markers|/scan_nav)$'']"'

rviz:                             # visualization:=rviz (needs DDS to the robot)
  cmd: 'rviz2 -d "$(ros2 pkg prefix planisferio)/share/planisferio/rviz/planisferio.rviz" --ros-args -p use_sim_time:=true'

stale_process_patterns: []